<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Korkometr 8.5 – IDEALNA WERSJA</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f5f7fa;--card:#fff;--text:#222;--primary:#1565c0;--success:#1b5e20;--warning:#ff9800}
    [data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--primary:#4a9eff;--success:#2e7d32}
    body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text);transition:.4s all;padding-bottom:100px}
    .container{max-width:540px;margin:0 auto;padding:15px}
    h2{text-align:center;color:var(--primary);margin:20px 0 8px;font-size:24px}
    .card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    input[type=text],select,input[type=time]{width:100%;padding:16px;margin:12px 0;font-size:17px;border-radius:12px;border:1px solid #ddd;background:var(--card);color:var(--text);box-sizing:border-box}
    .buttons-row{display:flex;gap:12px;justify-content:center;margin:12px 0}
    .btn{padding:14px;border-radius:50%;width:56px;height:56px;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
    .geo{background:var(--warning);color:#fff}
    .swap{background:var(--primary);color:#fff}
    .fav{background:#e91e63;color:#fff}
    .theme{position:fixed;top:15px;right:15px;background:var(--primary);color:#fff;z-index:100}
    .main-btn{background:var(--success);color:#fff;padding:18px;font-size:19px;font-weight:bold;border-radius:100px;width:100%;border:none;margin-top:20px;cursor:pointer}
    #result{text-align:center;font-size:21px;padding:30px;border-radius:16px}
    #map{height:380px;border-radius:16px;overflow:hidden;margin:20px 0;box-shadow:0 4px 20px rgba(0,0,0,.15)}
    .google-maps-btn{display:block;background:#4285f4;color:#fff;text-align:center;padding:18px;font-size:18px;border-radius:100px;text-decoration:none;margin:20px 0;font-weight:bold}
    .sweet-window{background:#e8f5e9;padding:25px;border-radius:16px;text-align:center;font-size:19px;margin:20px 0;border:3px solid var(--success)}
    .chart-container{background:var(--card);border-radius:16px;padding:20px;margin:20px 0;display:none}
    .option-row{display:flex;align-items:center;margin:12px 0;font-size:16px}
    .option-row input[type="radio"]{margin-right:10px;transform:scale(1.3)}
    .option-row label{cursor:pointer;flex:1}
    .route-info{font-size:16px;text-align:center;padding:15px;background:rgba(255,152,0,.15);border-radius:12px;margin:15px 0;font-weight:bold}
    .fav-item{padding:12px;background:rgba(0,0,0,.05);border-radius:10px;margin:8px 0;cursor:pointer}
  </style>
</head>
<body>
<button class="btn theme" id="themeToggle">🌙</button>

<div class="container">
  <h2>🚗 Korkometr 8.5 – IDEALNA WERSJA</h2>

  <div class="card">
    <input type="text" id="startInput" placeholder="📍 Skąd jedziesz?">
    <div class="buttons-row">
      <button class="btn geo" id="geoBtn">📍</button>
      <button class="btn swap" id="swapBtn">↔</button>
      <button class="btn fav" id="saveFavBtn">❤️</button>
    </div>
    <input type="text" id="endInput" placeholder="🏁 Dokąd zmierzasz?">

    <div id="favoritesList" style="margin:20px 0"></div>

    <div class="option-row"><input type="radio" name="trafficModel" value="bestguess" id="tmBest" checked><label for="tmBest">🚦 Realistycznie</label></div>
    <div class="option-row"><input type="radio" name="trafficModel" value="pessimistic" id="tmPess"><label for="tmPess">🚧 Pesymistycznie</label></div>

    <input type="time" id="departFrom" value="14:00">
    <input type="time" id="departTo" value="20:00">
    <select id="stepSelect">
      <option value="5">co 5 min</option>
      <option value="10" selected>co 10 min</option>
      <option value="15">co 15 min</option>
    </select>

    <button class="main-btn" id="bestTimeBtn">🚀 Oblicz najlepszą godzinę!</button>
  </div>

  <div id="result" class="card">Wypełnij pola i kliknij 🚀</div>
  <div class="route-info" id="routeInfo" style="display:none"></div>
  <div class="sweet-window" id="sweetWindow" style="display:none">
    <strong>🟢 Sweet spot:</strong><br>
    <span id="sweetText" style="font-size:32px;color:var(--success)"></span>
  </div>

  <div id="map" class="card" style="padding:0"></div>
  <a href="#" id="googleMapsLink" class="google-maps-btn" style="display:none" target="_blank">
    🗺️ Otwórz w Google Maps (o tej godzinie!)
  </a>

  <div class="chart-container" id="chartContainer">
    <canvas id="trafficChart"></canvas>
  </div>
</div>

<script>
  // Tryb ciemny
  const themeBtn = document.getElementById('themeToggle');
  const dark = localStorage.getItem("kork_dark") === "1" || (!localStorage.getItem("kork_dark") && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.body.setAttribute('data-theme','dark');
  themeBtn.innerHTML = dark ? "☀️" : "🌙";
  themeBtn.onclick = () => {
    const isDark = !document.body.hasAttribute('data-theme');
    document.body.toggleAttribute('data-theme');
    themeBtn.innerHTML = isDark ? "☀️" : "🌙";
    localStorage.setItem("kork_dark", isDark ? "1" : "0");
  };

  let map, ds, dr, chart = null;
  let allResults = [], shortestDistance = Infinity, fastestTime = Infinity;

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {center:{lat:52.2297,lng:21.0122},zoom:11,gestureHandling:"greedy"});
    ds = new google.maps.DirectionsService();
    dr = new google.maps.DirectionsRenderer({map, polylineOptions:{strokeColor:"#1565c0",strokeWeight:8}});

    new google.maps.places.Autocomplete(document.getElementById("startInput"), {componentRestrictions:{country:"pl"}});
    new google.maps.places.Autocomplete(document.getElementById("endInput"), {componentRestrictions:{country:"pl"}});

    document.getElementById("swapBtn").onclick = () => {
      const a = document.getElementById("startInput").value;
      const b = document.getElementById("endInput").value;
      document.getElementById("startInput").value = b;
      document.getElementById("endInput").value = a;
    };

    document.getElementById("geoBtn").onclick = () => {
      if (!navigator.geolocation) return alert("Brak geolokacji");
      document.getElementById("geoBtn").innerHTML = "⏳";
      navigator.geolocation.getCurrentPosition(pos => {
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({location:{lat:pos.coords.latitude,lng:pos.coords.longitude}}, (r,s) => {
          document.getElementById("geoBtn").innerHTML = "📍";
          if (s==="OK") document.getElementById("startInput").value = r[0].formatted_address;
        });
      }, () => document.getElementById("geoBtn").innerHTML = "📍");
    };

    document.getElementById("saveFavBtn").onclick = () => {
      const s = document.getElementById("startInput").value.trim();
      const e = document.getElementById("endInput").value.trim();
      if (!s || !e) return;
      let f = JSON.parse(localStorage.getItem("kfav")||"[]");
      const key = s+" → "+e;
      if (!f.includes(key)) f.unshift(key);
      localStorage.setItem("kfav", JSON.stringify(f.slice(0,20)));
      loadFavorites();
    };

    function loadFavorites() {
      const f = JSON.parse(localStorage.getItem("kfav")||"[]");
      document.getElementById("favoritesList").innerHTML = f.map(x=>`<div class="fav-item" onclick="loadFav('\( {x}')"> \){x}</div>`).join("");
    }
    window.loadFav = t => { const [a,b] = t.split(" → "); document.getElementById("startInput").value = a; document.getElementById("endInput").value = b; };
    loadFavorites();

    document.getElementById("bestTimeBtn").onclick = findBestTime;
  }

  async function findBestTime() {
    const start = document.getElementById("startInput").value.trim();
    const end = document.getElementById("endInput").value.trim();
    if (!start || !end) return alert("Wpisz trasę!");

    document.getElementById("result").innerHTML = "⏳ Analiza korków...";
    document.getElementById("chartContainer").style.display = "none";
    document.getElementById("routeInfo").style.display = "none";
    document.getElementById("sweetWindow").style.display = "none";
    if (chart) chart.destroy();
    allResults = []; shortestDistance = Infinity; fastestTime = Infinity;

    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(0,0,0,0);
    const [h1,m1] = document.getElementById("departFrom").value.split(":").map(Number);
    const [h2,m2] = document.getElementById("departTo").value.split(":").map(Number);
    const step = parseInt(document.getElementById("stepSelect").value);

    let current = new Date(tomorrow);
    current.setHours(h1,m1);
    const endTime = new Date(tomorrow);
    endTime.setHours(h2,m2);

    while (current <= endTime) {
      const res = await getRoute(start, end, new Date(current));
      if (res) allResults.push(res);
      current.setMinutes(current.getMinutes() + step);
    }

    if (allResults.length === 0) { document.getElementById("result").innerHTML = "Brak danych"; return; }

    const minTime = Math.min(...allResults.map(r => r.time));
    const candidates = allResults.filter(r => r.time <= minTime + 1).sort((a,b) => a.departure - b.departure);
    const winner = candidates[0];

    const sweetStart = candidates[0].departure.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
    const sweetEnd = candidates[candidates.length-1].departure.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
    const bestHour = winner.departure.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});

    document.getElementById("result").innerHTML = `
      <div style="background:#e8f5e9;padding:30px;border-radius:16px;font-size:22px">
        WYJEDŹ O <strong style="font-size:42px;color:#1b5e20">${bestHour}</strong><br><br>
        ≈ \( {winner.time} min ( \){winner.distance.toFixed(1)} km)
      </div>`;

    document.getElementById("sweetWindow").style.display = "block";
    document.getElementById("sweetText").innerHTML = sweetStart + " – " + sweetEnd;

    if (shortestDistance !== Infinity) {
      const diffKm = winner.distance - shortestDistance;
      const diffMin = fastestTime - winner.time;
      if (Math.abs(diffKm) > 0.5) {
        document.getElementById("routeInfo").style.display = "block";
        document.getElementById("routeInfo").innerHTML = diffKm > 0 
          ? `+\( {diffKm.toFixed(1)} km, ale – \){diffMin} min vs najkrótsza`
          : `–\( {(-diffKm).toFixed(1)} km, ale + \){(-diffMin)} min vs najszybsza`;
      }
    }

    dr.setDirections(winner.route);

    // LINK DO GOOGLE MAPS Z DOKŁADNĄ GODZINĄ
    const depUnix = Math.floor(winner.departure.getTime() / 1000);
    document.getElementById("googleMapsLink").href = 
      `https://www.google.com/maps/dir/?api=1&origin=\( {encodeURIComponent(start)}&destination= \){encodeURIComponent(end)}&travelmode=driving&departure_time=${depUnix}`;
    document.getElementById("googleMapsLink").style.display = "block";

    drawChart();
  }

  async function getRoute(start, end, time) {
    return new Promise(resolve => {
      ds.route({
        origin: start,
        destination: end,
        travelMode: "DRIVING",
        drivingOptions: {departureTime: time, trafficModel: document.querySelector('input[name="trafficModel"]:checked').value},
        provideRouteAlternatives: true
      }, (res, status) => {
        if (status !== "OK") return resolve(null);
        const route = res.routes[0];
        const leg = route.legs[0];
        const timeMin = Math.round(leg.duration_in_traffic.value / 60);
        const distKm = leg.distance.value / 1000;

        if (distKm < shortestDistance) shortestDistance = distKm;
        if (timeMin < fastestTime) fastestTime = timeMin;

        resolve({
          departure: time,
          time: timeMin,
          distance: distKm,
          route: res
        });
      });
    });
  }

  function drawChart() {
    document.getElementById("chartContainer").style.display = "block";
    const ctx = document.getElementById('trafficChart').getContext('2d');
    if (chart) chart.destroy();

    const labels = allResults.map(r => r.departure.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"}));
    const data = allResults.map(r => r.time);
    const min = Math.min(...data);
    const green = allResults.map((r,i) => data[i] <= min + 1 ? i : -1).filter(i => i >= 0);

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Czas w korkach (min)',
          data: data,
          borderColor: '#d32f2f',
          backgroundColor: 'rgba(211,47,47,0.1)',
          fill: true,
          tension: 0.4,
          pointBackgroundColor: data.map((_,i) => green.includes(i) ? '#1b5e20' : '#ff5252'),
          pointRadius: data.map((_,i) => green.includes(i) ? 12 : 6)
        }]
      },
      options: {
        onClick: (e, el) => {
          if (el.length > 0) {
            const i = el[0].index;
            dr.setDirections(allResults[i].route);
          }
        },
        plugins: { title: { display: true, text: 'Kliknij punkt → zmieni się trasa na mapie', font: {size: 16}}}
      }
    });
  }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjZtlDfYFM6yDqKGCoCrt4YA7uPVur-yk&libraries=places&callback=initMap" async defer></script>
</body>
</html>
